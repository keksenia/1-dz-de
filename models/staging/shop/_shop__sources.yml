version: 2

sources:
  - name: shop
    description: "Сырые таблицы OLTP-базы магазина, загруженные в Greenplum (база dwh, схема raw) сервисом loader. dbt их только читает."
    schema: raw
    tables:
      - name: customers
        description: "Клиенты. Одна строка — один зарегистрированный клиент."
      - name: products
        description: "Товары. Категория хранится текстом — названием из product_categories."
      - name: product_categories
        description: "Дерево категорий: у подкатегории заполнен parent_category_id."
      - name: orders
        description: "Заказы. Одна строка — один заказ, total_amount — сумма позиций со скидками."
      - name: order_items
        description: "Позиции заказов. Ключ — пара (order_id, product_id)."
      - name: payments
        description: >
          Платёжные операции. У заказа может быть несколько операций: неуспешная попытка,
          оплата частями, повторное списание. Возврат записан успешной операцией с отрицательной суммой.
        columns:
          - name: payment_id
            data_tests: [unique, not_null]
